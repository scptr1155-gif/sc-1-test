<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Simülasyonu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: url('https://picsum.photos/1920/1080') no-repeat center center fixed;
            background-size: cover;
        }

        /* Masaüstü */
        #desktop {
            width: 100%;
            height: calc(100vh - 40px);
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
        }

        .icon {
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            border-radius: 5px;
            cursor: pointer;
        }

        .icon:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .icon svg {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
        }

        /* Pencere */
        .window {
            position: absolute;
            width: 400px;
            height: 300px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
            top: 100px;
            left: 100px;
            z-index: 10;
        }

        .window-header {
            height: 35px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            cursor: move;
            border-bottom: 1px solid #ccc;
        }

        .window-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .close-btn {
            width: 25px;
            height: 25px;
            background: #ff5f56;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #e0443e;
        }

        .window-body {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            color: #333;
        }

        /* Görev Çubuğu */
        #taskbar {
            height: 40px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
        }

        .start-btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover {
            background: #005a9e;
        }

        #clock {
            color: white;
            font-size: 13px;
        }

        /* Başlat Menüsü */
        #start-menu {
            position: absolute;
            bottom: 45px;
            left: 10px;
            width: 250px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            color: white;
            z-index: 99;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .menu-item {
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="icon" onclick="openWindow('win-computer')">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v10H4z"/><path d="M20 18H4a2 2 0 01-2-2V6a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2zm-8 1h4v2h-4z"/></svg>
            <span>Bilgisayarım</span>
        </div>
        <div class="icon" onclick="openWindow('win-notes')">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/></svg>
            <span>Notlar</span>
        </div>
    </div>

    <div id="win-computer" class="window">
        <div class="window-header" onmousedown="dragStart(event, 'win-computer')">
            <span class="window-title">Bu Bilgisayar</span>
            <button class="close-btn" onclick="closeWindow('win-computer')"></button>
        </div>
        <div class="window-body">
            <h3>Sürücüler</h3>
            <br>
            <p>💾 Yerel Disk (C:) - 120 GB boş / 500 GB</p>
            <p>💾 Yeni Cilt (D:) - 450 GB boş / 1 TB</p>
        </div>
    </div>

    <div id="win-notes" class="window">
        <div class="window-header" onmousedown="dragStart(event, 'win-notes')">
            <span class="window-title">Not Defteri</span>
            <button class="close-btn" onclick="closeWindow('win-notes')"></button>
        </div>
        <div class="window-body">
            <textarea style="width:100%; height:100%; border:none; outline:none; resize:none;" placeholder="Notlarınızı buraya yazın..."></textarea>
        </div>
    </div>

    <div id="start-menu">
        <div class="menu-item" onclick="openWindow('win-computer'); toggleStartMenu();">💻 Bu Bilgisayar</div>
        <div class="menu-item" onclick="openWindow('win-notes'); toggleStartMenu();">📝 Not Defteri</div>
        <hr style="border-color: #444;">
        <div class="menu-item" onclick="alert('Sistem Kapatılıyor...')">🔌 Kapat</div>
    </div>

    <div id="taskbar">
        <button class="start-btn" onclick="toggleStartMenu()">Başlat</button>
        <div id="clock">00:00:00</div>
    </div>

    <script>
        // Saat Güncelleme
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Pencere Aç/Kapat
        function openWindow(id) {
            const win = document.getElementById(id);
            win.style.display = 'flex';
            bringToFront(win);
        }

        function closeWindow(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Başlat Menüsü Aç/Kapat
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // Öne Getirme Sırası
        let highestZ = 10;
        function bringToFront(element) {
            highestZ++;
            element.style.zIndex = highestZ;
        }

        // Pencere Sürükleme Mantığı
        let activeWin = null;
        let offsetX = 0, offsetY = 0;

        function dragStart(e, id) {
            activeWin = document.getElementById(id);
            bringToFront(activeWin);
            offsetX = e.clientX - activeWin.offsetLeft;
            offsetY = e.clientY - activeWin.offsetTop;

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
        }

        function dragMove(e) {
            if (activeWin) {
                activeWin.style.left = (e.clientX - offsetX) + 'px';
                activeWin.style.top = (e.clientY - offsetY) + 'px';
            }
        }

        function dragEnd() {
            activeWin = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
        }
    </script>
</body>
</html>
